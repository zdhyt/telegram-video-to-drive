name: Telegram Video Bot

on:
  repository_dispatch:
    types: [telegram_video]

  workflow_dispatch:

concurrency:
  group: telegram-video-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "yt-dlp[default]" google-api-python-client google-auth google-auth-httplib2 requests

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.x

      - name: Run Telegram bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

          DRIVE_INPUT_FOLDER_ID: ${{ secrets.DRIVE_INPUT_FOLDER_ID }}

          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}

          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

          TELEGRAM_URL: ${{ github.event.client_payload.url }}
          TELEGRAM_CHAT_ID: ${{ github.event.client_payload.chat_id }}

        run: python bot.py
